# Example workflow: check paid.lock on every pull request and push to main.
# Copy to .github/workflows/paid-lock.yml. Read-only, no secret. Use `pull_request`, never
# `pull_request_target`: the probe reads paid.lock from the PR, so it must run without write access.
name: paid.lock

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to a full commit SHA (the 0.1.1 release commit); update it when you update paid-lock.
      - name: paid.lock
        uses: metafrogmeme-droid/paid-lock@f57b774ba49cc9b6a71dd1f14875e0887f00c042 # 0.1.1
        with:
          lockfile: paid.lock
          fail-on: needs-ok # default: fail on "Blocked by your rule" and on "Needs your OK"
          # Optional: keep one comment with the report on the PR. Then add `pull-requests: write` to
          # this job's permissions. On PRs from forks the token is read-only and the comment is skipped
          # with a warning; the check itself still runs.
          # comment: true
