# Example workflow: check paid.lock every day, so a seller that changes its
# terms between pull requests is noticed. Copy to .github/workflows/paid-lock-daily.yml.
name: paid.lock daily

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pin to the release's full commit SHA once 0.1.0 is published (nothing is published yet).
      - name: paid.lock
        id: paidlock
        uses: metafrogmeme-droid/paid-lock@v0.1.0
        with:
          lockfile: paid.lock
          sarif: paid-lock.sarif

      # Optional: show the findings in the Security tab. Needs `security-events: write` on this job
      # and, on a private repository, GitHub Code Security. Pin the action by full commit SHA.
      # - uses: github/codeql-action/upload-sarif@<full commit SHA> # v4.x
      #   if: always()
      #   with:
      #     sarif_file: paid-lock.sarif
