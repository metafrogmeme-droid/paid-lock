# Written with AI help. CI for paid.lock (CLAUDE.md §0, §5, §6 M1).
#
# Local fixtures only: the mock seller on loopback. No live endpoint, no repository secret, no key.
# The only token is the read-only GITHUB_TOKEN (`permissions: contents: read`); checkout does not
# keep it (persist-credentials: false). zizmor gets it for its online audits (impostor commits).
#
# Pins: every action by full commit SHA (tag in the comment), each SHA checked against the Go
# module proxy's record of the tag and raw.githubusercontent.com/<action>/<sha>/action.yml on
# 31 Oct 2026. Tool binaries by version + SHA-256 of the release archive. Python tools by version.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: 1.31.1
  SEMGREP_VERSION: 1.183.0

jobs:
  check:
    name: check (format, lint, types, tests + coverage, copy-lint, deps, never-pays, guard reach, audit, mock seller, demo, action dist)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Tests with coverage gate (core >= 95% lines and branches)
        run: pnpm test:coverage

      - name: copy-lint (three verdict strings, banned words, AI-help labels)
        run: pnpm copy-lint

      - name: Dependency allowlist (no wallet or signing library in probe, cli, core, protocols)
        run: pnpm check:deps

      - name: Never-pays source scan
        run: pnpm check:never-pays

      - name: Guard reach (every pay path in the runtime adapters calls a paid.lock check)
        run: pnpm check:guard-reach

      - name: Mock seller smoke test (402 + PAYMENT-REQUIRED on loopback, 0 payment headers)
        run: pnpm smoke:mock-seller

      - name: Demo (paid-lock add/verify against the mock seller; DEMO OK line, 0 payments sent)
        run: pnpm demo

      - name: Action bundle is fresh (action/dist rebuilt from source matches the committed file)
        run: pnpm check:action-dist

      - name: Dependency audit
        run: pnpm audit --audit-level low

  action-selftest:
    # One job runs all ten cases in sequence (one machine instead of ten; same cases and checks as the
    # former matrix). Each case re-serves the mock seller, runs the Action from this commit and records
    # its outcome; the last step checks every outcome and verdict output.
    name: action self-test (10 cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pin /forecast of the mock seller (loopback, opt-in recorded in the lock)
        run: node scripts/action-selftest.ts setup

      - name: "Serve case: unchanged"
        run: node scripts/action-selftest.ts serve unchanged

      - name: "Run the Action: unchanged"
        id: c01
        # `./` (local action at this commit) is the documented form; actionlint 1.7.12 does not yet
        # accept the newer `$/` syntax that zizmor suggests, so that suggestion is ignored here.
        uses: ./ # zizmor: ignore[self-repository]
        continue-on-error: true
        with:
          lockfile: .ci/action-selftest/paid.lock
          fail-on: needs-ok
          sarif: .ci/action-selftest/c01.sarif

      - name: "Serve case: payTo swapped"
        run: node scripts/action-selftest.ts serve payto-swapped

      - name: "Run the Action: payTo swapped"
        id: c02
        # `./` (local action at this commit) is the documented form; actionlint 1.7.12 does not yet
        # accept the newer `$/` syntax that zizmor suggests, so that suggestion is ignored here.
        uses: ./ # zizmor: ignore[self-repository]
        continue-on-error: true
        with:
          lockfile: .ci/action-selftest/paid.lock
          fail-on: needs-ok
          sarif: .ci/action-selftest/c02.sarif

      - name: "Serve case: network swapped"
        run: node scripts/action-selftest.ts serve network-swapped

      - name: "Run the Action: network swapped"
        id: c03
        # `./` (local action at this commit) is the documented form; actionlint 1.7.12 does not yet
        # accept the newer `$/` syntax that zizmor suggests, so that suggestion is ignored here.
        uses: ./ # zizmor: ignore[self-repository]
        continue-on-error: true
        with:
          lockfile: .ci/action-selftest/paid.lock
          fail-on: needs-ok
          sarif: .ci/action-selftest/c03.sarif

      - name: "Serve case: price x3"
        run: node scripts/action-selftest.ts serve price-x3

      - name: "Run the Action: price x3"
        id: c04
        # `./` (local action at this commit) is the documented form; actionlint 1.7.12 does not yet
        # accept the newer `$/` syntax that zizmor suggests, so that suggestion is ignored here.
        uses: ./ # zizmor: ignore[self-repository]
        continue-on-error: true
        with:
          lockfile: .ci/action-selftest/paid.lock
          fail-on: needs-ok
          sarif: .ci/action-selftest/c04.sarif

      - name: "Serve case: price halved"
        run: node scripts/action-selftest.ts serve price-half

      - name: "Run the Action: price halved"
        id: c05
        # `./` (local action at this commit) is the documented form; actionlint 1.7.12 does not yet
        # accept the newer `$/` syntax that zizmor suggests, so that suggestion is ignored here.
        uses: ./ # zizmor: ignore[self-repository]
        continue-on-error: true
        with:
          lockfile: .ci/action-selftest/paid.lock
          fail-on: needs-ok
          sarif: .ci/action-selftest/c05.sarif

      - name: "Serve case: extra.version changed"
        run: node scripts/action-selftest.ts serve extra-version

      - name: "Run the Action: extra.version changed"
        id: c06
        # `./` (local action at this commit) is the documented form; actionlint 1.7.12 does not yet
        # accept the newer `$/` syntax that zizmor suggests, so that suggestion is ignored here.
        uses: ./ # zizmor: ignore[self-repository]
        continue-on-error: true
        with:
          lockfile: .ci/action-selftest/paid.lock
          fail-on: needs-ok
          sarif: .ci/action-selftest/c06.sarif

      - name: "Serve case: extra.version changed with fail-on blocked"
        run: node scripts/action-selftest.ts serve extra-version

      - name: "Run the Action: extra.version changed with fail-on blocked"
        id: c07
        # `./` (local action at this commit) is the documented form; actionlint 1.7.12 does not yet
        # accept the newer `$/` syntax that zizmor suggests, so that suggestion is ignored here.
        uses: ./ # zizmor: ignore[self-repository]
        continue-on-error: true
        with:
          lockfile: .ci/action-selftest/paid.lock
          fail-on: blocked
          sarif: .ci/action-selftest/c07.sarif

      - name: "Serve case: 200 unpaid"
        run: node scripts/action-selftest.ts serve unpaid-200

      - name: "Run the Action: 200 unpaid"
        id: c08
        # `./` (local action at this commit) is the documented form; actionlint 1.7.12 does not yet
        # accept the newer `$/` syntax that zizmor suggests, so that suggestion is ignored here.
        uses: ./ # zizmor: ignore[self-repository]
        continue-on-error: true
        with:
          lockfile: .ci/action-selftest/paid.lock
          fail-on: needs-ok
          sarif: .ci/action-selftest/c08.sarif

      - name: "Serve case: garbage header"
        run: node scripts/action-selftest.ts serve garbage-header

      - name: "Run the Action: garbage header"
        id: c09
        # `./` (local action at this commit) is the documented form; actionlint 1.7.12 does not yet
        # accept the newer `$/` syntax that zizmor suggests, so that suggestion is ignored here.
        uses: ./ # zizmor: ignore[self-repository]
        continue-on-error: true
        with:
          lockfile: .ci/action-selftest/paid.lock
          fail-on: needs-ok
          sarif: .ci/action-selftest/c09.sarif

      - name: "Serve case: missing lock (tool error)"
        run: node scripts/action-selftest.ts serve unchanged

      - name: "Run the Action: missing lock (tool error)"
        id: c10
        # `./` (local action at this commit) is the documented form; actionlint 1.7.12 does not yet
        # accept the newer `$/` syntax that zizmor suggests, so that suggestion is ignored here.
        uses: ./ # zizmor: ignore[self-repository]
        continue-on-error: true
        with:
          lockfile: .ci/action-selftest/missing.lock
          fail-on: needs-ok
          sarif: .ci/action-selftest/c10.sarif

      - name: Check every case's outcome and verdict output
        if: always()
        env:
          C01: ${{ steps.c01.outcome }}/${{ steps.c01.outputs.verdict }}
          C02: ${{ steps.c02.outcome }}/${{ steps.c02.outputs.verdict }}
          C03: ${{ steps.c03.outcome }}/${{ steps.c03.outputs.verdict }}
          C04: ${{ steps.c04.outcome }}/${{ steps.c04.outputs.verdict }}
          C05: ${{ steps.c05.outcome }}/${{ steps.c05.outputs.verdict }}
          C06: ${{ steps.c06.outcome }}/${{ steps.c06.outputs.verdict }}
          C07: ${{ steps.c07.outcome }}/${{ steps.c07.outputs.verdict }}
          C08: ${{ steps.c08.outcome }}/${{ steps.c08.outputs.verdict }}
          C09: ${{ steps.c09.outcome }}/${{ steps.c09.outputs.verdict }}
          C10: ${{ steps.c10.outcome }}/${{ steps.c10.outputs.verdict }}
        run: |
          failed=0
          check() {
            if [ "$2" = "$3" ]; then echo "ok   $1: $2"; else echo "FAIL $1: got $2, want $3"; failed=1; fi
          }
          check "unchanged" "$C01" success/allowed
          check "payTo swapped" "$C02" failure/blocked
          check "network swapped" "$C03" failure/blocked
          check "price x3" "$C04" failure/blocked
          check "price halved" "$C05" success/allowed
          check "extra.version changed" "$C06" failure/needsOk
          check "extra.version changed with fail-on blocked" "$C07" success/needsOk
          check "200 unpaid" "$C08" failure/needsOk
          check "garbage header" "$C09" failure/blocked
          check "missing lock (tool error)" "$C10" failure/error
          exit "$failed"

      - name: Stop the mock seller (fails if it saw any payment header)
        if: always()
        run: node scripts/action-selftest.ts stop

  tests-other-node:
    # The check job runs every test with coverage on Node 24; this job runs them on Node 22 (the oldest
    # supported) and Node 26 (the newest) in one machine instead of a three-job matrix.
    name: tests (node 22 and 26)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Tests on Node 22
        run: node --version && pnpm test

      - name: Set up Node 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Tests on Node 26
        run: node --version && pnpm test

  gitleaks:
    name: gitleaks (full history + rules self-test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (SHA-256 checked)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: gitleaks git (every commit)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

      - name: gitleaks rules self-test
        run: bash scripts/gitleaks-selftest.sh

  workflows:
    name: workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }} (SHA-256 checked)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: actionlint (workflows and the example workflows in docs/examples)
        run: actionlint -color .github/workflows/*.yml docs/examples/*.yml

      - name: zizmor ${{ env.ZIZMOR_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        # zizmor's wheel ships a binary, not a Python module: call the console script from a venv.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "zizmor==${ZIZMOR_VERSION}"
          "$RUNNER_TEMP/venv/bin/zizmor" --min-severity low --format plain .github/workflows

  semgrep:
    name: semgrep (static security scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install semgrep ${{ env.SEMGREP_VERSION }}
        # `python -m semgrep` is deprecated (exits 2); call the console script from a venv.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
          echo "$RUNNER_TEMP/venv/bin" >>"$GITHUB_PATH"

      - name: Project rule tests
        run: semgrep --test --config .semgrep/paid-lock.yml .semgrep/paid-lock.ts

      - name: semgrep scan (project rules + registry JS/TS packs)
        run: |
          semgrep scan --metrics off --error \
            --config .semgrep/paid-lock.yml --config p/javascript --config p/typescript .
